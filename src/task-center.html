<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CAD AI Bridge · 任务中心</title>
<style>
:root{color-scheme:light dark;--bg:#f3f5f7;--surface:#fff;--ink:#182635;--muted:#586878;--line:#dce3ea;--brand:#155dba;--bad:#b22e35;--good:#186548}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 "Microsoft YaHei",system-ui,sans-serif}header{padding:24px 4vw;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:20px;flex-wrap:wrap}h1{font-size:23px;margin:0}h2{font-size:19px;margin:0 0 14px}h3{font-size:16px;margin:16px 0 8px}p{margin:5px 0 14px}.muted{color:var(--muted)}main{max-width:1500px;margin:28px auto;padding:0 4vw;display:grid;grid-template-columns:340px minmax(0,1fr);gap:24px}.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px;margin-bottom:22px}label{display:block;margin:12px 0 4px;font-weight:600}input,select,textarea,button{font:inherit;border:1px solid var(--line);border-radius:6px;padding:9px 11px;background:var(--surface);color:var(--ink)}input,select,textarea{width:100%}textarea{resize:vertical;min-height:100px}button{cursor:pointer;min-height:42px}button:hover{border-color:var(--brand)}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid #72aeff;outline-offset:2px}button.primary{background:var(--brand);color:#fff;border-color:var(--brand)}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row.space{justify-content:space-between}.jobs{display:grid;gap:9px}.job{text-align:left;width:100%;overflow-wrap:anywhere}.job small{display:block;color:var(--muted)}.badge{font-size:13px;display:inline-block;border-radius:20px;background:var(--bg);padding:3px 10px;margin-right:7px}.failed,.blocked{color:var(--bad)}.passed,.completed{color:var(--good)}.notice{border-left:4px solid var(--brand);padding:12px 15px;background:var(--bg);margin:12px 0}.error{color:var(--bad);white-space:pre-wrap;overflow-wrap:anywhere}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:9px;border-bottom:1px solid var(--line);vertical-align:top}th{font-weight:600}.files{display:flex;gap:8px;flex-wrap:wrap}.item{border-top:1px solid var(--line);padding:14px 0}.preview{display:block;max-width:100%;max-height:450px;object-fit:contain;background:#eef1f3;border:1px solid var(--line);margin-top:12px}pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:400px;overflow:auto;font-size:12px}#message{max-width:1500px;margin:15px auto;padding:0 4vw}.hidden{display:none}footer{padding:0 4vw 24px;color:var(--muted);font-size:13px}@media(prefers-color-scheme:dark){:root{--bg:#131b24;--surface:#1c2734;--ink:#e6edf5;--muted:#a7b7c9;--line:#35465a;--brand:#286ac2;--bad:#ff969e;--good:#76d1ac}}@media(max-width:850px){main{grid-template-columns:1fr}header{padding:18px}main{padding:0 16px;margin:16px auto}.panel{padding:17px}}
</style>
<header><div><h1>CAD AI Bridge</h1><span class="muted">任务中心 · 当前电脑</span></div><div class="row"><button id="refresh">刷新任务</button><button id="diagnose">检查接入</button><button id="shutdown">关闭本地入口</button></div></header>
<div id="message" role="status" aria-live="polite"></div>
<main><aside><section class="panel"><h2>新建图纸任务</h2><p class="muted">原图保留，结果另存副本。多张图按顺序处理。</p><form id="create"><label for="paths">图纸完整路径</label><textarea id="paths" required placeholder="每行一张 DWG，可从资源管理器复制路径"></textarea><label for="task">任务</label><select id="task"><option value="takeoff">统计对象并交付 CSV</option><option value="replace_text">替换文字</option><option value="export_batch">输出 PDF 和 PNG</option></select><div id="textFields" class="hidden"><label for="search">查找文字</label><input id="search" maxlength="512"><label for="replacement">替换为</label><input id="replacement" maxlength="512"></div><label for="layer">限定图层（可选）</label><input id="layer" maxlength="255" placeholder="留空表示所有图层"><p class="muted">统计为图面出现次数；图例和重复视图需主动排除。</p><button type="submit" class="primary" id="submit">开始任务</button></form></section><section class="panel"><h2>最近任务</h2><div id="jobs" class="jobs"></div><button id="more" class="hidden">加载更多</button></section></aside>
<section><article class="panel" id="detail"><h2>任务进度与结果</h2><p class="muted">选择任务，查看阶段、逐图结果和验证范围。</p><div class="notice">执行成功与工程验收分别显示。未覆盖的检查和需要人工复核的项目会保留在结果中。</div></article></section></main>
<footer>本地服务，仅当前电脑访问。关闭浏览器不会取消已开始任务；取消会等待当前图纸完成，再停止后续项。无需模型账号，AI 对话继续使用原客户端。</footer>
<script>
const $=id=>document.getElementById(id),labels={preparing:'准备中',queued:'排队中',running:'执行中',completed:'已完成',failed:'失败',partial:'部分完成',stopped:'已停止',cancelled:'已取消',pending:'未开始',blocked:'存在阻断，需核对',unconfirmed:'状态待核对',passed:'通过',unknown:'未验证',not_applicable:'不适用'},levelNames={execution:'执行',source:'源图身份',saved:'保存文件',reopened:'独立重开',geometry:'几何后置条件',preservation:'非目标内容保护',render:'输出文件检查',visualReview:'人工视觉复核',delivery:'交付完整性'};
const actionNames={engineering_notes:'待审说明修订',engineering_title:'图签标题修订',engineering_intake:'需求意图草稿',engineering_task:'专业设计任务',architecture:'建筑空间导入',engineering:'工程设计项目',project:'项目任务',workflow:'图纸任务',scan:'图纸读取',analyze:'工程检查与计量',edit:'副本编辑',export_many:'批量出图',export:'出图',create_drawing:'新建图纸'},levelDescriptions={execution:'请求的操作是否完成，与后续验证分别记录。',source:'核对开始与完成时的原图身份，外部变化也会报告。',saved:'保存的 DWG 与记录摘要一致。',reopened:'用独立 CAD 读取核对同一份保存文件。',geometry:'核对已实现的几何和属性后置条件，未覆盖项保留。',preservation:'核对非目标 DXF 实体与图块记录，不涵盖全部数据库语义。',render:'检查输出格式与声明纸张参数，字体和图面仍需复核。',visualReview:'需要核对字体、裁切、可读性和工程图面。',delivery:'所需文件存在且摘要匹配。'};
const linkedJob=new URLSearchParams(location.search).get('job'),fragment=new URLSearchParams(location.hash.slice(1)),token=fragment.get('token')||sessionStorage.getItem('cadbridge-local-token');if(token){sessionStorage.setItem('cadbridge-local-token',token);history.replaceState(null,'',location.pathname+(linkedJob?'?job='+encodeURIComponent(linkedJob):''));}let selected,selectedOffset=0,listSnapshot,listVersion=0,listBusy=false,offset=0,busy=false,loadingDetail=false,watch=false;const blobs=[];
function node(tag,text,cls){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e;}
function message(text,error=false){$('message').replaceChildren(node('div',text,error?'error':'notice'));}
async function api(url,body){const r=await fetch(url,{method:body?'POST':'GET',headers:{Authorization:'Bearer '+token,...(body?{'Content-Type':'application/json'}:{})},body:body?JSON.stringify(body):undefined});const value=await r.json();if(!r.ok||value.ok===false&&!value.jobRoot&&!value.status&&!Array.isArray(value.checks))throw Error(value.error?.message||value.error||'请求未完成');return value;}
const call=(action,args)=>api('/api/call',{action,args});
function button(text,handler){const b=node('button',text);b.type='button';b.addEventListener('click',()=>Promise.resolve(handler()).catch(e=>message(e.message,true)));return b;}
function badge(status){return node('span',labels[status]||status||'未知','badge '+status);}
async function refresh(append=false){if(append&&listBusy)return;const version=append?listVersion:++listVersion;listBusy=true;$('more').disabled=true;try{if(!append){offset=0;listSnapshot=undefined;$('jobs').replaceChildren();}const r=await api('/api/jobs?offset='+offset+'&limit=20'+(listSnapshot?'&snapshot='+listSnapshot:''));if(version!==listVersion)return;listSnapshot=r.snapshotId;for(const job of r.jobs){const b=button((labels[job.status]||job.status)+' · '+(actionNames[job.action]||job.action||'任务'),()=>show(job.jobId));b.className='job';b.append(node('small',job.updatedAt?new Date(job.updatedAt).toLocaleString():'时间未知'),node('small',job.itemCount?'共 '+job.itemCount+' 张图':''));$('jobs').append(b);}offset=r.nextOffset;$('more').classList.toggle('hidden',!r.hasMore);if(!r.jobs.length&&!append)$('jobs').append(node('p','暂无任务','muted'));}catch(e){message(e.message,true);}finally{if(version===listVersion){listBusy=false;$('more').disabled=false;}}}
function verification(parent,value){if(!value)return;const title=node('h3','验证范围');parent.append(title,badge(value.status));if(value.levels){const table=node('table');const head=node('tr');head.append(node('th','项目'),node('th','结论与范围'));table.append(head);for(const [key,level]of Object.entries(value.levels)){if(level.status==='not_applicable')continue;const tr=node('tr'),td=node('td');td.append(badge(level.status),node('div',levelDescriptions[key]||level.reason||level.scope,'muted'));if(level.pending?.length)td.append(node('div','未覆盖项：'+level.pending.map(p=>p.reason||p.type).slice(0,5).join('；'),'muted'));tr.append(node('td',levelNames[key]||key),td);table.append(tr);}parent.append(table);}else parent.append(node('p','此记录没有分级验证证据。执行成功不代表已独立核对几何、保存或出图质量。','muted'));}
async function download(jobId,index,file,preview=false){const response=await fetch('/api/file?jobId='+encodeURIComponent(jobId)+'&index='+index+'&sha256='+encodeURIComponent(file.sha256),{headers:{Authorization:'Bearer '+token}});if(!response.ok){const r=await response.json();throw Error(r.error||'文件不可用');}const blob=await response.blob(),url=URL.createObjectURL(blob);blobs.push(url);if(preview){const image=node('img');image.src=url;image.alt='任务输出预览，仍需核对字体与图面';image.className='preview';$('detail').append(image);}else{const a=node('a');a.href=url;a.download=file.file.split(/[\\/]/).pop();a.click();}}
function showResult(parent,result,jobId){if(result.error)parent.append(node('p',result.error.message||result.error.code,'error'));if(result.drawingSaved)parent.append(node('p','DWG 已保存。验证或出图失败时仍保留该文件，请勿重复修改。','notice'));if(result.summary){const s=result.summary;parent.append(node('p',s.changed!==undefined?'修改 '+s.changed+' · 新增 '+s.created+' · 删除 '+s.removed:JSON.stringify(s)));}if(result.statistics?.entityCount!==undefined)parent.append(node('p','统计对象 '+result.statistics.entityCount+' 个，分组 '+result.statistics.groupCount+' 组。'));verification(parent,result.verification);if(result.coverage)parent.append(node('p','范围：'+(result.coverage.scope||'冻结查询')+'；单位：'+(result.coverage.units||'未知'),'muted'));if(result.quantityResults?.length){parent.append(node('h3','计量汇总'));const table=node('table'),head=node('tr');head.append(node('th','规则'),node('th','数量'),node('th','范围'));table.append(head);for(const q of result.quantityResults){const tr=node('tr');tr.append(node('td',q.id),node('td',q.total===null?'总量未完整':q.total+' '+q.unit),node('td','已测 '+q.measured+' / '+q.selected+'，缺项 '+q.missing));table.append(tr);}parent.append(table);}if(result.issues?.length)parent.append(node('p','检查发现 '+(result.summary?.issues??result.issues.length)+' 项问题，明细见问题 CSV。','notice'));const files=node('div',undefined,'files'),fileLabels={'dwg':'DWG 图纸','dxf':'DXF 记录','summary-csv':'汇总 CSV','detail-csv':'对象明细 CSV','issues-csv':'检查问题 CSV','quantities-csv':'计量明细 CSV','png':'PNG 图像','pdf':'PDF 图纸'};for(const [index,file]of(result.files||[]).entries()){const filename=file.file.split(/[\\/]/).pop();files.append(button((file.kind==='pdf_source'?'下载 CAD 原始 PDF：':'下载 ')+filename,()=>download(jobId,index,file)));if(file.kind?.includes('png'))files.append(button('预览 '+filename,()=>download(jobId,index,file,true)));}parent.append(files);}
async function show(jobId,pageOffset=0){selected=jobId;selectedOffset=pageOffset;const record=await call("get_job",{jobId});if(selected!==jobId||selectedOffset!==pageOffset)return;if(record.parentJobId){await show(record.parentJobId);return;}const parent=$("detail");for(const url of blobs)URL.revokeObjectURL(url);blobs.length=0;parent.replaceChildren(node('h2','任务进度与结果'));if(selected!==jobId||selectedOffset!==pageOffset)return;const state=record.task;watch=['running','preparing','queued'].includes(state?.status);if(state?.action==='architecture'){showArchitecture(parent,record.result,jobId);}else if(state?.action==='engineering_notes'){await showEngineeringNotes(parent,jobId,record.result);}else if(state?.action==='engineering_title'){await showEngineeringTitle(parent,jobId,record.result);}else if(state?.action==='engineering_intake'){await showEngineeringIntake(parent,jobId,record.result);}else if(state?.action==='engineering_task'){await showEngineeringTask(parent,jobId,record.result);}else if(state?.action==='engineering'){await showEngineering(parent,jobId);}else if(state?.action==='project'){const project=await call('project',{action:'status',jobId,offset:pageOffset});if(selected!==jobId||selectedOffset!==pageOffset)return;watch=['running','preparing','queued'].includes(project.status);parent.append(badge(project.status),node('p','阶段：'+({freezing_inputs:'冻结源图',ready:'准备执行',executing:'处理图纸',finished:'任务结束'}[project.phase]||project.phase||'准备中')));const controls=node('div',undefined,'row');if(['running','queued'].includes(project.status))controls.append(button('停止后续图纸',async()=>{await call('project',{action:'cancel',jobId});message('已请求取消，等待当前图纸完成。');await show(jobId);}));if(['stopped','cancelled','blocked','partial'].includes(project.status))controls.append(button('继续未开始的图纸',async()=>{await call('project',{action:'resume',jobId});message('继续未开始项；已保存和状态不明项不会重做。');await show(jobId);}));parent.append(controls);if(project.error)parent.append(node('p',project.error.message,'error'));for(const item of project.items){const section=node('section',undefined,'item');section.append(node('h3',item.sourceDrawing?.split(/[\\/]/).pop()||item.id),badge(item.status));if(item.sourceIntegrity&&item.sourceIntegrity.actualSha256!==item.sourceIntegrity.expectedSha256)section.append(node('p','原图在冻结后发生变化或已不可读取。结果基于冻结副本。','error'));if(item.result){showResult(section,item.result,item.childJobId);if(item.result.filesTruncated)section.append(button('查看全部交付文件',()=>show(item.childJobId)));}if(item.error)section.append(node('p',item.error.message,'error'));parent.append(section);}if(project.hasMore)parent.append(button('下一组图纸',()=>show(jobId,project.nextOffset)));if(project.offset>0)parent.append(button('上一组图纸',()=>show(jobId,Math.max(0,project.offset-20))));}else{parent.append(badge(record.status),node('p','阶段：'+(state?.phase||'未知')));if(record.result)showResult(parent,record.result,jobId);else parent.append(node('p','尚无最终结果。保存状态不明时先核对已有文件，不要重复执行。','notice'));}const details=node('details'),summary=node('summary','查看技术记录');details.append(summary,node('pre',JSON.stringify(record,null,2)));parent.append(details);}
function showArchitecture(parent,result,jobId){
 parent.append(node('h3','建筑空间来源与完整性'));if(!result){parent.append(node('p','正在读取所选建筑范围，等待已记录的结果。','notice'));return;}const c=result.coverage,t=result.traversal;
 parent.append(node('p','核对范围仅限本次选择的根实体、图层和空间清单；建筑来源及专业签审尚未确认。','notice'));
 if(t)parent.append(node('p','根实体 '+t.rootsVisited+' 个 · 遍历 '+t.visitedEntities+' 个对象 · '+(t.completeLocalScope?'局部遍历完整':'局部遍历不完整')+' · 排除外参 '+t.excludedXrefs.length+' 个'));
 if(c)parent.append(node('p','清单 '+c.expectedRooms+' 个物理空间 · 来源名称 '+(c.expectedLabelEntries??c.expectedRooms)+' 项 · 解析 '+c.resolvedRooms+' 个 · 明确闭合边界 '+c.observedBoundaries+' 个 · 推断 '+c.inferredRooms+' 个'),node('p',c.geometryComplete?'所列空间几何已逐一对应；门口、吊顶、功能与项目整体覆盖仍需确认。':'空间条件尚未完整，不能直接作为整层设计输入。','notice'));
 if(result.sourceTextSummary){const s=result.sourceTextSummary;parent.append(node('p','来源文字 '+s.sourceLabels+' 项 · 显式拼接 '+s.appliedAssemblies+' 个名称 · 保留排除注记 '+s.retainedIgnoredText+' 组 · 可能项目条件 '+s.potentialProjectConditions+' 组'),node('p','排除空间标签不会删除建筑注记。文字邻接建议尚未自动采纳；下载 spatial-review.html 可定位空间、查看原片段与问题。','notice'));}
 const packFile=result.files?.find(f=>f.kind==='json'&&f.file.replaceAll('\\','/').endsWith('/spaces.json'));if(packFile)parent.append(button('查看空间名称与兼用标签',async()=>{const response=await fetch('/api/file?jobId='+encodeURIComponent(jobId)+'&index=0&sha256='+encodeURIComponent(packFile.sha256),{headers:{Authorization:'Bearer '+token}});if(!response.ok){const r=await response.json();throw Error(r.error||'建筑来源文件不可用');}const pack=await response.json();if(selected!==jobId)return;const previous=document.getElementById('architecture-label-review');if(previous)previous.remove();const section=node('section');section.id='architecture-label-review';section.append(node('h3','空间名称与兼用标签'),node('p','按登记摘要读取：声明物理空间 '+pack.coverage.expectedRooms+' 个；来源名称条目 '+(pack.coverage.expectedLabelEntries??pack.coverage.expectedRooms)+' 个。空间合并属于显式解释，兼用功能尚未完成适用性核对。','notice'));for(const room of pack.rooms)for(const label of room.aliases||[]){const item=node('div',undefined,'item');item.append(node('h4',room.id+' / '+room.name+' → '+label.id+' / '+label.name),node('p','声明关系：'+(label.relationship==='secondary_use'?'兼用功能':'别名')+'；空间核对：'+(label.spatialStatus==='same_observed_boundary'?'同一明确闭合边界':label.spatialStatus==='inside_inferred_boundary'?'位于推断边界内，待确认':'位置冲突'),'notice'));const source=node('details');source.append(node('summary','查看来源对象与解释'),node('p',(label.label.instancePaths||[label.label.instancePath]).map(p=>p.join('/')).join('; ')),node('p',label.reason,'muted'));item.append(source);section.append(item);}section.append(node('h3','排除注记仍保留的项目条件'));for(const note of pack.sourceText?.retainedIgnoredText||[])section.append(node('p',note.text+' · '+(note.potentialProjectCondition?'可能项目条件，尚未解释':'原文保留待核对')+' · '+note.members.map(m=>m.instancePath.join('/')).join('; '),note.potentialProjectCondition?'notice':'muted'));const files=parent.querySelector('.files');if(files)parent.insertBefore(section,files);else parent.append(section);}));

 parent.append(button('查看功能理解与未决项',async()=>{const result=await call('engineering',{action:'status',jobId,section:'functional_intake'});if(selected!==jobId)return;const old=document.getElementById('functional-intake');if(old)old.remove();const section=node('section');section.id='functional-intake';section.append(node('h3','功能理解与未决项'));if(!result.records.length)section.append(node('p','当前输入未登记客户端功能理解记录；这不证明实际任务理解已验证。','notice'));for(const r of result.records){section.append(node('h4',r.roomId));for(const a of [...(r.primary?[{...r.primary,labelId:r.roomId}]:[]),...(r.secondaryUses||[]),...(r.unresolved||[])]){const d=node('details');d.append(node('summary',a.labelId+' · '+(a.use?a.use+' / '+a.classId:'未解决，阻断')),node('p',a.reason));for(const e of a.evidence)d.append(node('p','任务书原句 ['+e.sourceId+']：'+e.quote));section.append(d);}}const labels={FUNCTIONAL_INTAKE_UNRESOLVED:'功能尚未确认',SECONDARY_SPACE_USE_UNSUPPORTED:'缺少兼用功能评估',ROOM_USE_REQUIRES_SPECIALIST:'空间用途需要专项确认',FUNCTIONAL_INTERPRETATION_REVIEW:'功能解释待专业复核'};for(const issue of result.issues)section.append(node('p',(issue.severity==='blocking'?'阻断：':'待审：')+(labels[issue.code]||issue.code)+'。'+(issue.code==='FUNCTIONAL_INTERPRETATION_REVIEW'?'已保留任务书原句和来源，实际用途及标准适用性仍需确认。':issue.message),issue.severity==='blocking'?'error':'notice'));section.append(node('p','原句与摘要核对只证明可追溯；语义判断、项目用途及标准适用性仍待专业审核。','notice'));const files=parent.querySelector('.files');if(files)parent.insertBefore(section,files);else parent.append(section);}));
 parent.append(button('查看多用途共同依据',async()=>{const result=await call('engineering',{action:'status',jobId,section:'space_uses'});if(selected!==jobId)return;const old=document.getElementById('multi-use-basis');if(old)old.remove();const section=node('section');section.id='multi-use-basis';section.append(node('h3','多用途共同依据'));if(!result.rooms?.length)section.append(node('p','当前修订尚无已计算的多用途共同布局依据。兼用功能缺项及阻断见项目问题。','notice'));for(const room of result.rooms||[]){const t=room.targets;section.append(node('h4',room.roomId+' / '+room.roomName),node('p','用途共同约束：平均照度范围 '+t.minimumLux+'—'+t.maximumAverageLux+'lx；U0下限 '+t.minimumUniformity+'；Ra下限 '+t.minimumRa+'；LPD上限 '+t.maximumLpd+'W/m²；UGR上限 '+t.maximumUgr+'；工作面 '+t.workplaneM+'m。','notice'));for(const use of room.useAssessments){const detail=node('details');detail.append(node('summary',(use.relationship==='primary_use'?'主用途':'兼用功能')+' '+use.labelId+' · '+use.rule.label+' ['+use.rule.id+']'),node('p','声明用途 '+use.use+'；来源 '+use.sourceIds.join(' / ')),node('p',use.classification.reason),node('p','该用途标准下限：'+use.rule.minimumLux+'lx / U0 '+use.rule.minimumUniformity+' / Ra '+use.rule.minimumRa+'；上限：'+use.rule.maximumLpd+'W/m² / UGR '+use.rule.maximumUgr));section.append(detail);}}section.append(node('p','同一固定布局、工作面、表面与观察条件；不认证不同姿态/工作面或分时模式。分类及专业适用性仍待审核。','notice'));const files=parent.querySelector('.files');if(files)parent.insertBefore(section,files);else parent.append(section);}));

$('refresh').addEventListener('click',()=>refresh());$('more').addEventListener('click',()=>refresh(true));$('diagnose').addEventListener('click',async()=>{try{selected=undefined;watch=false;const r=await call('doctor',{refresh:true});message(r.ok?'接入检查通过。':'接入检查尚未通过。');const parent=$('detail');parent.replaceChildren(node('h2','接入检查'));for(const check of r.checks||[]){const row=node('p');row.append(badge(check.ok?'passed':'failed'),node('span',check.name+'：'+(check.detail||'')));parent.append(row);}}catch(e){message(e.message,true);}});
$('shutdown').addEventListener('click',async()=>{try{await api('/api/shutdown',{});selected=undefined;watch=false;message('本地入口已关闭。已开始的图纸处理会继续完成；需要查看结果时重新打开任务中心。');}catch(e){message(e.message,true);}});
$('task').addEventListener('change',()=>{const text=$('task').value==='replace_text';$('textFields').classList.toggle('hidden',!text);$('search').required=text;$('replacement').required=text;});
$('create').addEventListener('submit',async event=>{event.preventDefault();if(busy)return;busy=true;$('submit').disabled=true;try{const paths=$('paths').value.split(/\r?\n/).map(v=>v.trim().replace(/^"|"$/g,'')).filter(Boolean);if(!paths.length)throw Error('请填写图纸完整路径');const type=$('task').value,layer=$('layer').value.trim(),plan=type==='replace_text'?{type,search:$('search').value,replacement:$('replacement').value,match:'contains'}:type==='export_batch'?{type,items:[{name:'sheet',format:'pdf'},{name:'preview',format:'png'}]}:{type,groupBy:['type','layer','blockName']};const r=await call('project',{action:'start',requestId:crypto.randomUUID(),items:paths.map((drawing,i)=>({id:'Drawing_'+(i+1),drawing,plan,preview:false,filter:layer?{layers:[layer]}:{}}))});message('任务已开始，原图保持保留。');await refresh();await show(r.jobId);}catch(e){message(e.message,true);}finally{busy=false;$('submit').disabled=false;}});
if(!token)message('请通过本机启动入口打开任务中心，当前页面缺少访问凭据。',true);else{refresh();if(linkedJob){if(/^job-[A-Za-z0-9_-]+$/.test(linkedJob))show(linkedJob).catch(e=>message(e.message,true));else message('任务链接中的编号无效。',true);}call('capabilities',{}).then(r=>{if(r.execution?.readOnly){$('task').querySelector('option[value="replace_text"]').disabled=true;message('当前为只读模式，可统计和出图；图纸修改已禁用。');}}).catch(e=>message(e.message,true));}setInterval(()=>{if(selected&&watch&&!busy&&!loadingDetail){loadingDetail=true;show(selected,selectedOffset).catch(e=>message(e.message,true)).finally(()=>{loadingDetail=false;});}},5000);
